<!--
  E-tqan — promotional video scene engine.

  A deterministic, frame-locked motion-graphics stage: every visual is a pure
  function of time, so `window.__seek(seconds)` + a screenshot always produces
  the same frame. `render.mjs` drives it with Playwright and pipes the frames
  into ffmpeg. Nothing here animates on its own (no CSS animations, no
  requestAnimationFrame, no Math.random at draw time) — that is what makes the
  output reproducible.

  Layout adapts to the viewport: landscape (16:9), portrait (9:16) or square.
-->

<div id="stage">

<script>
/* ════════════════════════════════════════════════════════
   Utilities — deterministic maths only
   ════════════════════════════════════════════════════════ */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const win = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const eIn = (t) => Math.pow(clamp(t), 3);
const eio = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eBack = (t) => { t = clamp(t); const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function mulberry(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let x = Math.imul(s ^ (s >>> 15), 1 | s);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
const fmt2 = (n) => String(Math.max(0, Math.floor(n))).padStart(2, "0");

const ACCENT = {
  emerald: ["#0E3B31", "#12B981"],
  gold:    ["#3A2E10", "#F4D98B"],
  royal:   ["#132347", "#2F5FD0"],
  cyan:    ["#0A2C34", "#0E7C93"],
  violet:  ["#241237", "#7A42C9"],
};
function bookStyle(accent) {
  const [dark, light] = ACCENT[accent];
  return `background: linear-gradient(155deg, ${dark} 0%, #0A0906 62%), radial-gradient(120% 90% at 10% 0%, ${light}33, transparent 60%);`;
}

/* Catalogue used on screen (mirrors src/catalog.ts). */
const COURSES = [
  { t: "Python",       ar: "بايثون",              tr: "Python",        a: "emerald" },
  { t: "JavaScript",   ar: "جافاسكريبت",          tr: "JavaScript",    a: "gold" },
  { t: "Java",         ar: "جافا",                tr: "Java",          a: "royal" },
  { t: "HTML",         ar: "HTML",                tr: "HTML",          a: "cyan" },
  { t: "CSS",          ar: "CSS",                 tr: "CSS",           a: "violet" },
  { t: "SQL",          ar: "SQL",                 tr: "SQL",           a: "emerald" },
  { t: "AI Arsenal",   ar: "ترسانة الذكاء",       tr: "AI Cephaneliği",a: "gold" },
  { t: "AI Apps",      ar: "تطبيقات الذكاء",      tr: "AI Uygulama",   a: "royal" },
  { t: "Websites",     ar: "بناء المواقع",        tr: "Web Siteleri",  a: "cyan" },
  { t: "Excel + AI",   ar: "إكسل والذكاء",        tr: "Excel + AI",    a: "emerald" },
  { t: "Design",       ar: "التصميم",             tr: "Tasarım",       a: "violet" },
  { t: "Languages",    ar: "حزمة اللغات",         tr: "Diller Paketi", a: "royal" },
  { t: "Future Skills",ar: "مهارات المستقبل",     tr: "Gelecek",       a: "emerald" },
  { t: "Gold Master",  ar: "المكتبة الذهبية",     tr: "Altın Kütüphane",a: "gold" },
];

/* Arabic subtitle cues — mirrors marketing/subtitles/ar.srt. */
const CUES = [
  [7, 16,  "في عالمٍ يتغيّر كل يوم… المهارة الحقيقية هي ما لا يفقد قيمته أبدًا."],
  [17, 30, "برمجة، ذكاء اصطناعي، ويب، تصميم، وإنتاجية — في مكتبةٍ واحدة."],
  [31, 45, "كل دورة… بالإنجليزية والعربية والتركية. تعلّم باللغة التي تفكّر بها."],
  [46, 65, "ليست مجرد صفحات — بل دروسٌ وتمارينُ ومشاريعُ حقيقية تبنيها بيديك."],
  [66, 85, "ومع «ترسانة الذكاء الاصطناعي»… تتحوّل كل فكرة إلى دراسة جدوى متكاملة."],
  [86, 105,"ادفع بأمان… ونزّل فورًا. لا انتظار، لا تعقيد."],
  [106,125,"آلافٌ بدؤوا رحلتهم… والنتيجة مهارةٌ تبقى مدى الحياة."],
  [126,142,"عرض الإطلاق مستمرٌّ حتى الثلاثين من يوليو — هذه لحظتك."],
  [143,150,"E-tqan. ابدأ اليوم."],
];

/* ════════════════════════════════════════════════════════
   Stage plumbing
   ════════════════════════════════════════════════════════ */
const stage = document.getElementById("stage");
const scenesEl = document.getElementById("scenes");
const bg = document.getElementById("bg");
const grain = document.getElementById("grain");
const subEl = document.getElementById("sub");
const subBar = subEl.firstElementChild;
const wm = document.getElementById("watermark");
let W = 0, H = 0, bgx, gx, PORTRAIT = false;

function measure() {
  W = window.innerWidth; H = window.innerHeight;
  const ratio = W / H;
  PORTRAIT = ratio < 0.85;
  document.body.className = PORTRAIT ? "portrait" : ratio > 1.2 ? "landscape" : "square";
  for (const c of [bg, grain]) { c.width = W; c.height = H; }
  bgx = bg.getContext("2d"); gx = grain.getContext("2d");
  buildVignette(); buildGrainTiles(); layoutNodes(); buildMonogramTargets();
}

/* ── background node network ─────────────────────────── */
let NODES = [];
function layoutNodes() {
  const r = mulberry(20260725);
  NODES = [];
  for (let i = 0; i < 84; i++) {
    NODES.push({
      x: r() * 1.2 - 0.1, y: r() * 1.2 - 0.1,
      p: r() * Math.PI * 2, s: 0.4 + r() * 0.9, z: 0.35 + r() * 0.65,
    });
  }
}

/* Sample an "E" glyph into particle targets for the ignition scene. */
let MONO_PTS = [];
function buildMonogramTargets() {
  const S = 220, c = document.createElement("canvas");
  c.width = S; c.height = S;
  const x = c.getContext("2d");
  x.fillStyle = "#fff";
  x.font = "800 190px Sora, sans-serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText("E", S / 2, S / 2 + 6);
  const d = x.getImageData(0, 0, S, S).data;
  MONO_PTS = [];
  for (let y = 0; y < S; y += 5) {
    for (let px = 0; px < S; px += 5) {
      if (d[(y * S + px) * 4 + 3] > 140) MONO_PTS.push([px / S - 0.5, y / S - 0.5]);
    }
  }
}

/* ── vignette + film grain ───────────────────────────── */
let vign = null, GRAIN = [];
function buildVignette() {
  vign = document.createElement("canvas");
  vign.width = W; vign.height = H;
  const v = vign.getContext("2d");
  const g = v.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.16, W / 2, H / 2, Math.max(W, H) * 0.78);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(0.62, "rgba(0,0,0,0.16)");
  g.addColorStop(1, "rgba(0,0,0,0.62)");
  v.fillStyle = g; v.fillRect(0, 0, W, H);
}
function buildGrainTiles() {
  GRAIN = [];
  for (let k = 0; k < 6; k++) {
    const T = 220, c = document.createElement("canvas");
    c.width = T; c.height = T;
    const x = c.getContext("2d"), img = x.createImageData(T, T), r = mulberry(1000 + k);
    for (let i = 0; i < T * T; i++) {
      const v = 128 + (r() - 0.5) * 150;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 15;
    }
    x.putImageData(img, 0, 0);
    GRAIN.push(c);
  }
}

/* ════════════════════════════════════════════════════════
   Scene registry
   ════════════════════════════════════════════════════════ */
const SCENES = [];
function scene(id, a, b, html, up) {
  const el = document.createElement("section");
  el.className = "scene";
  el.dataset.id = id;
  el.innerHTML = `<div class="cam">${html}</div>`;
  scenesEl.appendChild(el);
  SCENES.push({ id, a, b, el, cam: el.firstElementChild, up, q: (s) => el.querySelector(s), qa: (s) => [...el.querySelectorAll(s)] });
}
const FADE = 0.45;

/* ── helpers that emit markup ────────────────────────── */
function bookHTML(title, sub, accent, badge) {
  return `<div class="book" style="${bookStyle(accent)}">
    <div class="spineline"></div><div class="sheen"></div>
    <div><div class="bf">${badge}</div></div>
    <div><div class="brule"></div><div class="bt goldgrad">${title}</div><div class="bs">${sub}</div></div>
  </div>`;
}
function coverHTML(c, w, h) {
  return `<div class="cover" style="${bookStyle(c.a)} width:${w}rem; height:${h}rem;">
    <div class="cf">E-TQAN</div><div class="ct goldgrad">${c.t}</div></div>`;
}

/* ══════════════ 1 · Ignition (0:00–0:06) ══════════════ */
scene("ignition", 0, 6, `
  <div class="center">
    <div id="ig-mark" class="mono-mark" style="width:4.6rem;height:4.6rem;border-radius:1.3rem;font-size:2.6rem;margin:0 auto;opacity:0"></div>
    <div id="ig-word" style="opacity:0;margin-top:1.1rem" class="h2">E-tqan</div>
  </div>`,
(s, lt) => {
  const mark = s.q("#ig-mark"), word = s.q("#ig-word");
  const on = win(lt, 3.5, 4.6);
  mark.textContent = "E";
  mark.style.opacity = on;
  mark.style.transform = `scale(${lerp(0.72, 1, eBack(on))})`;
  const w = win(lt, 4.5, 5.4);
  word.style.opacity = w;
  word.style.letterSpacing = `${lerp(0.42, -0.02, eOut(w))}em`;
  word.style.transform = `translateY(${lerp(10, 0, eOut(w))}px)`;
  s.cam.style.transform = `scale(${lerp(1.08, 1, eio(lt / 6))})`;
});

/* ══════════════ 2 · Floating books (0:06–0:16) ════════ */
scene("books", 6, 16, `
  <div class="pad center">
    <div id="bk-row" class="row" style="justify-content:center;gap:1.5rem;perspective:1400px;transform-style:preserve-3d">
      ${bookHTML("Python", "From Zero to Confident Coder", "emerald", "Programming")}
      ${bookHTML("AI Arsenal 2026", "Every AI Tool + 200 Project Ideas", "gold", "AI")}
      ${bookHTML("CSS", "Design Beautiful Interfaces", "violet", "Web")}
    </div>
    <div id="bk-h" class="h1 ar center" style="margin-top:2.1rem;opacity:0">تعلّم المهارات التي <span class="goldgrad">تُدِرّ دخلًا حقيقيًا</span></div>
    <div id="bk-s" class="sub center" style="margin-top:0.7rem;opacity:0">Learn the skills that actually pay · EN · AR · TR</div>
  </div>`,
(s, lt) => {
  const books = s.qa(".book");
  books.forEach((b, i) => {
    const d = i * 0.22, p = eOut(win(lt, 0.15 + d, 1.5 + d));
    const bob = Math.sin((lt * 0.62 + i * 1.9)) * 0.5;
    const rot = lerp(24, 8, eio(win(lt, 0, 9))) * (i === 1 ? 0.4 : 1) * (i === 2 ? -1 : 1);
    b.style.opacity = p;
    b.style.transform =
      `translateY(${lerp(46, 0, p) + bob * 6}px) translateZ(${i === 1 ? 60 : 0}px) ` +
      `rotateY(${rot}deg) rotateX(${bob}deg) scale(${lerp(0.9, i === 1 ? 1.06 : 0.97, p)})`;
    b.querySelector(".sheen").style.transform = `translateX(${lerp(-60, 60, win(lt, 1.2 + d, 3.4 + d))}%)`;
  });
  const h = win(lt, 1.6, 2.5);
  s.q("#bk-h").style.opacity = h;
  s.q("#bk-h").style.filter = `blur(${lerp(9, 0, eOut(h))}px)`;
  s.q("#bk-h").style.transform = `translateY(${lerp(20, 0, eOut(h))}px)`;
  const g = win(lt, 2.4, 3.2);

/* ════════════════════════════════════════════════════════
   Background painter
   ════════════════════════════════════════════════════════ */
function paintBg(t) {
  const x = bgx;
  x.clearRect(0, 0, W, H);
  /* base */
  const gr = x.createRadialGradient(W * 0.5, H * 0.28, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.9);
  const warm = 0.5 + 0.5 * Math.sin(t * 0.12);
  gr.addColorStop(0, `rgba(${22 + warm * 10},${18 + warm * 7},${10 + warm * 4},1)`);
  gr.addColorStop(0.45, "#0C0A07");
  gr.addColorStop(1, "#050403");
  x.fillStyle = gr; x.fillRect(0, 0, W, H);

  /* ignition spark (scene 1) */
  const spark = win(t, 0.35, 1.1) * (1 - win(t, 4.4, 5.6));
  if (spark > 0.01) {
    const R = lerp(Math.min(W, H) * 0.02, Math.min(W, H) * 0.5, eOut(win(t, 0.4, 3.2)));
    const sg = x.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, R);
    sg.addColorStop(0, `rgba(255,240,205,${0.85 * spark})`);
    sg.addColorStop(0.25, `rgba(244,217,139,${0.32 * spark})`);
    sg.addColorStop(1, "rgba(244,217,139,0)");
    x.fillStyle = sg; x.fillRect(0, 0, W, H);
  }

  /* node network — converges onto the monogram during scene 1 */
  const conv = eio(win(t, 1.2, 3.6)) * (1 - win(t, 3.9, 5.0));
  const amb = 0.10 + 0.10 * Math.sin(t * 0.2);
  const scale = Math.min(W, H) * 0.62;
  const pts = [];
  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    const fx = (n.x + Math.sin(t * 0.16 * n.s + n.p) * 0.02) * W;
    const fy = (n.y + Math.cos(t * 0.14 * n.s + n.p) * 0.02) * H;
    let px = fx, py = fy;
    if (conv > 0.001 && MONO_PTS.length) {
      const m = MONO_PTS[(i * 7) % MONO_PTS.length];
      px = lerp(fx, W / 2 + m[0] * scale, conv);
      py = lerp(fy, H / 2 + m[1] * scale, conv);
    }
    pts.push([px, py, n.z]);
  }
  const alpha = lerp(amb, 0.85, conv);
  x.lineWidth = 1;
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1];
      const d2 = dx * dx + dy * dy, lim = (Math.min(W, H) * (conv > 0.3 ? 0.10 : 0.17)) ** 2;
      if (d2 < lim) {
        const f = 1 - d2 / lim;
        x.strokeStyle = `rgba(244,217,139,${(alpha * f * 0.5).toFixed(3)})`;
        x.beginPath(); x.moveTo(pts[i][0], pts[i][1]); x.lineTo(pts[j][0], pts[j][1]); x.stroke();
      }
    }
  }
  for (const [px, py, z] of pts) {
    const r = lerp(1.0, 2.4, z) * (1 + conv * 0.7);
    x.fillStyle = `rgba(252,240,208,${(alpha * lerp(0.5, 1, z)).toFixed(3)})`;
    x.beginPath(); x.arc(px, py, r, 0, 6.2832); x.fill();
  }

  /* gold bloom for the library pull-back + final sting */
  const bloom = Math.max(win(t, 128, 138) * 0.5, win(t, 142.2, 143.4) * (1 - win(t, 144.6, 146)));
  if (bloom > 0.01) {
    const bg2 = x.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, Math.max(W, H) * 0.7);
    bg2.addColorStop(0, `rgba(244,217,139,${0.16 * bloom})`);
    bg2.addColorStop(1, "rgba(244,217,139,0)");
    x.fillStyle = bg2; x.fillRect(0, 0, W, H);
  }
}

function paintGrain(frame) {
  gx.clearRect(0, 0, W, H);
  gx.drawImage(vign, 0, 0);
  const tile = GRAIN[frame % GRAIN.length];
  const off = (frame * 37) % tile.width;
  gx.globalAlpha = 0.5;
  for (let y = -off; y < H; y += tile.height) {
    for (let x2 = -off; x2 < W; x2 += tile.width) gx.drawImage(tile, x2, y);
  }
  gx.globalAlpha = 1;
}

/* ════════════════════════════════════════════════════════
   Seek — the only public entry point
   ════════════════════════════════════════════════════════ */
function seek(t, frame = 0) {
  paintBg(t);
  for (const s of SCENES) {
    const vis = clamp((t - (s.a - FADE)) / FADE) * (1 - clamp((t - s.b) / FADE));
    s.el.style.opacity = vis.toFixed(4);
    s.el.style.display = vis <= 0.001 ? "none" : "grid";
    if (vis > 0.001) s.up(s, clamp(t - s.a, 0, s.b - s.a), (t - s.a) / (s.b - s.a));
  }
  /* watermark: present through the body of the film */
  wm.style.opacity = (win(t, 6, 7) * (1 - win(t, 140, 141.5)) * 0.7).toFixed(3);
  /* subtitles */
  const cue = CUES.find(([a, b]) => t >= a && t <= b);
  if (cue) {
    if (subBar.textContent !== cue[2]) subBar.textContent = cue[2];
    const fin = Math.min(win(t, cue[0], cue[0] + 0.35), 1 - win(t, cue[1] - 0.3, cue[1]));
    subEl.style.opacity = clamp(fin).toFixed(3);
  } else {
    subEl.style.opacity = 0;
  }
  paintGrain(frame);
}
