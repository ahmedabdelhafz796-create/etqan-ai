<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A workflow: one trigger fanning into two nodes that rejoin.
       Replaced a three-candle chart mark. -->
  <rect width="64" height="64" rx="14" fill="#05070C"/>
  <g stroke="#6366F1" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M18 32 C 24 32, 24 19, 32 19"/>
    <path d="M18 32 C 24 32, 24 45, 32 45"/>
    <path d="M32 19 C 40 19, 40 32, 46 32"/>
    <path d="M32 45 C 40 45, 40 32, 46 32"/>
  </g>
  <circle cx="18" cy="32" r="6" fill="#05070C" stroke="#22D3EE" stroke-width="3"/>
  <circle cx="32" cy="19" r="5" fill="#05070C" stroke="#A5B4FC" stroke-width="3"/>
  <circle cx="32" cy="45" r="5" fill="#05070C" stroke="#A5B4FC" stroke-width="3"/>
  <circle cx="46" cy="32" r="6" fill="#05070C" stroke="#818CF8" stroke-width="3"/>
</svg>
