  :root{
    --ink:#05070b; --ivory:#DCE3EA; --muted:#6d7a8c;
    --prop:#7fe3e0; --mem:#e3a85c; --blood:#c4574f;
    --glitch:0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);
    font-family:Cairo,system-ui,sans-serif;color:var(--ivory);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:2;direction:ltr}
  #crosshair{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;
    border:1px solid rgba(220,227,234,.55);border-radius:50%}
  #crosshair::after{content:"";position:absolute;inset:5px;background:var(--prop);border-radius:50%;opacity:.85;
    transition:background .12s ease}
  #crosshair[data-aim="prop"]{border-color:var(--prop);transform:scale(1.5);transition:transform .12s ease}
  #crosshair[data-aim="enemy"]{border-color:#ff6a5a;transform:scale(1.5)}
  #crosshair[data-aim="enemy"]::after{background:#ff6a5a}
  #crosshair[data-aim="spent"]{border-color:#4a5666;opacity:.5}

  #objective{position:absolute;left:50%;top:14%;transform:translateX(-50%);opacity:0;
    transition:opacity .25s ease;max-width:88vw;text-align:center}
  #objective span{display:inline-block;font-size:clamp(.95rem,3.4vw,1.15rem);font-weight:700;
    color:#eaf1f8;background:rgba(6,10,16,.72);border:1px solid rgba(127,227,224,.35);
    border-radius:.7rem;padding:.55rem 1.1rem;line-height:1.6;backdrop-filter:blur(6px)}
  #objective.pulse span{animation:obj .5s ease-out}
  @keyframes obj{0%{transform:scale(.9);border-color:var(--prop)}100%{transform:scale(1)}}
  #vignette{position:absolute;inset:0;opacity:.3;
    background:radial-gradient(70% 60% at 50% 50%,transparent 40%,rgba(0,0,0,.85) 100%)}

  #bars{position:absolute;left:1.2rem;bottom:1.2rem;display:flex;flex-direction:column;gap:.5rem;width:min(38vw,15rem)}
  .bar{display:flex;align-items:center;gap:.55rem}
  .bar .lbl{font-size:.62rem;letter-spacing:.12em;color:var(--muted);min-width:3.2rem}
  .track{flex:1;height:.42rem;background:rgba(220,227,234,.1);border-radius:2rem;overflow:hidden}
  .track i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f0c98a,var(--mem));
    transition:width .12s linear}
  .track i.hp{background:linear-gradient(90deg,#e08b84,var(--blood))}

  #stats{position:absolute;right:1.2rem;top:1.1rem;display:flex;flex-direction:column;gap:.25rem;
    text-align:right;font-size:.78rem;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
  #toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);opacity:0;text-align:center;
    font-size:.92rem;font-weight:700;color:#ffd9a0;text-shadow:0 2px 12px rgba(0,0,0,.9);max-width:80vw}
  #toast.show{animation:tst 2.6s ease-out}
  @keyframes tst{0%{opacity:0;transform:translate(-50%,6px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
  #combo{color:var(--prop);font-weight:700}

  .card .kicker{font-size:.75rem;letter-spacing:.3em;color:var(--prop)}
  .card h1.win{color:var(--mem)}
  .card h1.pause{color:var(--ivory);font-size:clamp(2rem,8vw,3.4rem)}
  .card .best{margin-top:.5rem;font-size:.85rem;color:var(--muted);letter-spacing:.12em}
  .card .best b{color:var(--mem)}
  .langs{display:flex;gap:.5rem;justify-content:center;margin-top:1.6rem;flex-wrap:wrap}
  .langs button{font-family:inherit;font-size:.78rem;padding:.35rem .9rem;border-radius:2rem;cursor:pointer;
    border:1px solid rgba(220,227,234,.18);background:transparent;color:var(--muted)}
  .langs button.on{border-color:var(--prop);color:var(--prop)}

  #hand{position:absolute;left:50%;bottom:1.3rem;transform:translateX(-50%);text-align:center}
  #hand .lbl{display:block;font-size:.56rem;letter-spacing:.2em;color:var(--muted)}
  #hand b{font-size:1rem;letter-spacing:.05em}

  #stealbtn{position:absolute;right:1.2rem;bottom:5.5rem;width:4.2rem;height:4.2rem;border-radius:50%;
    border:1px solid rgba(127,227,224,.5);background:rgba(127,227,224,.12);color:var(--prop);
    font-size:1.5rem;pointer-events:auto;backdrop-filter:blur(6px)}
  #stealbtn:active{background:rgba(127,227,224,.3)}

    letter-spacing:.2em;opacity:0;color:var(--prop)}
  #wavemsg.show{animation:wm 2.1s ease-out}
  @keyframes wm{0%{opacity:0;transform:translateX(-50%) scale(.9)}15%{opacity:1}70%{opacity:1}100%{opacity:0}}

  .card h1.dead{color:var(--blood);font-size:clamp(2.2rem,9vw,4rem)}
  .card .sub{margin-top:1rem;color:var(--muted);font-size:1rem;line-height:1.8}
  .card .help{list-style:none;margin:1.6rem 0 0;display:flex;flex-direction:column;gap:.4rem;
    font-size:.84rem;color:#9aa7b6}
  .card .final{margin-top:.9rem;font-size:1.1rem;color:#9aa7b6}
  .card .final b{color:var(--mem);font-size:1.5rem}
  .card .cta{margin-top:1.8rem;font-size:.9rem;letter-spacing:.22em;color:var(--prop);
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
